name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          ver="${GITHUB_REF_NAME#v}"
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

      - name: Write mikan-addon.json
        run: |
          set -eu
          digest="${{ steps.build.outputs.digest }}"
          echo "digest=${digest}"
          printf '%s\n' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'
          jq --arg v "${{ steps.meta.outputs.version }}" \
             --arg image "${{ steps.meta.outputs.image }}" \
             --arg digest "${digest}" \
             --arg home "https://github.com/${GITHUB_REPOSITORY}" \
             '. + {version:$v, image:$image, digest:$digest, homepage:$home}' \
             addon.json > mikan-addon.json
          cat mikan-addon.json

      - name: Make the package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "/users/${{ github.repository_owner }}/packages/container/addon-mikan" -f visibility=public \
            || echo "package visibility will be set after the first push"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" mikan-addon.json \
            --title "v${{ steps.meta.outputs.version }} — бот подписчиков" \
            --notes "Образ ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}

          Страница в админке: приветствие, кнопки меню, автоответ и рассылка тем, кто написал боту /start.
          После установки назначьте этот аддон ботом в настройках Telegram панели."
